# GoHomeBuddy 构建流水线
#
# 成本策略（私有仓库 Actions 按 macOS 10x / Windows 2x 倍率计费）：
# - 推送到 main / PR：只构建 Linux（最便宜的持续验证）
# - 手动触发（targets=all）或推送 v* 标签：全平台矩阵
#   Linux(Ubuntu, deb) / Windows(msi) / macOS ARM(dmg) / macOS Intel(dmg)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: "构建目标"
        type: choice
        default: linux
        options:
          - linux
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          FULL=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then FULL=true; fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.targets }}" == "all" ]]; then FULL=true; fi
          if $FULL; then
            matrix='{"include":[
              {"os":"ubuntu-22.04","name":"linux-x64","target":"x86_64-unknown-linux-gnu","bundles":"deb","artifact":"GoHomeBuddy-linux-x64"},
              {"os":"windows-latest","name":"windows-x64","target":"x86_64-pc-windows-msvc","bundles":"msi","artifact":"GoHomeBuddy-windows-x64"},
              {"os":"macos-14","name":"macos-arm64","target":"aarch64-apple-darwin","bundles":"dmg","artifact":"GoHomeBuddy-macos-arm64"},
              {"os":"macos-14","name":"macos-intel","target":"x86_64-apple-darwin","bundles":"dmg","artifact":"GoHomeBuddy-macos-intel"}
            ]}'
          else
            matrix='{"include":[
              {"os":"ubuntu-22.04","name":"linux-x64","target":"x86_64-unknown-linux-gnu","bundles":"deb","artifact":"GoHomeBuddy-linux-x64"}
            ]}'
          fi
          echo "matrix=$(echo "$matrix" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 安装 Linux 系统依赖（Tauri）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装依赖
        run: npm ci

      - name: 构建协议包
        run: npm run build -w @office/contracts

      - name: 构建 sidecar
        run: npm run build -w @office/sidecar

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: 编译随包引擎
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) BUN_TARGET=bun-linux-x64 ;;
            x86_64-pc-windows-msvc)   BUN_TARGET=bun-windows-x64 ;;
            aarch64-apple-darwin)     BUN_TARGET=bun-darwin-arm64 ;;
            x86_64-apple-darwin)      BUN_TARGET=bun-darwin-x64 ;;
          esac
          OUT="apps/desktop/src-tauri/binaries/gohomebuddy-engine-${{ matrix.target }}"
          [ "$(uname)" = "Windows" ] && OUT="$OUT.exe"
          bun build apps/sidecar/dist/index.js --compile --target="$BUN_TARGET" --outfile "$OUT"

      - name: Tauri 构建
        shell: bash
        env:
          # sidecar 仓库根路径在编译期固化，与本地打包命令保持一致
          OFFICE_AGENT_ROOT: ${{ github.workspace }}
        run: |
          ARGS="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then
            ARGS="$ARGS --target ${{ matrix.target }}"
          fi
          npm run tauri -w @office/desktop -- build $ARGS

      - name: 产物清单
        shell: bash
        run: find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null || echo "bundle 目录为空"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    # v* 标签触发时：汇总四个平台的安装包，创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: 产物清单
        run: ls -laR dist
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GoHomeBuddy ${{ github.ref_name }}（开发预览）"
          body: |
            开发预览版：安装包可构建、可安装，本地引擎已随包分发（无需用户预装 Node.js）。

            本版主要变化：
            - 模型配置由应用接管：厂商预设只提供 Base URL 与协议，模型清单通过「检测模型」或手动输入产生并写入应用配置
            - 设置页：已配置模型按厂商折叠展示，可编辑 / 删除 / 添加；添加配置支持检测模型与手动填写 Model ID
            - 输入区：按模型能力限制控件（思考、多模态），工具栏响应式收缩回归，浮层不再被裁剪
            - 会话标题与内部权限指令解耦；会话支持右键菜单；工作空间可展开查看会话
            - 个人资料（用户名 / 头像）与左下角用户条目；Windows 启动不再弹出控制台窗口，引擎日志落盘
          generate_release_notes: true
          files: |
            dist/**
            dist/*
